[package]
name = "cuobject-sys"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Raw FFI bindings to NVIDIA's cuObject server and client libraries (libcuobjserver, libcuobjclient) for S3-over-RDMA"
readme = "README.md"
repository = "https://github.com/rainj-me/cuobject-sys"
documentation = "https://docs.rs/cuobject-sys"
keywords = ["cuobject", "rdma", "gpudirect", "s3", "ffi"]
categories = ["external-ffi-bindings"]
links = "cuobject"
build = "build.rs"
include = ["build.rs", "src/**", "csrc/**", "README.md", "LICENSE"]

[features]
default = ["server"]
# Bindings to libcuobjserver, which moves object bytes over RDMA.
server = []
# Bindings to libcuobjclient (and libcufile), which registers client memory and
# produces the tokens a server transfers against.
client = []

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
features = ["server", "client"]

[build-dependencies]
bindgen = { version = "0.73", default-features = false, features = ["prettyplease", "runtime"] }
cc = "1.2"
